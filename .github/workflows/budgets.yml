name: Budgets

# The budgets in tests/test_performance.py: each operation must stay within a few times what it took when its budget was set, so a
# change that makes something many times slower is noticed right after it is merged. (The Performance workflow's daily ASV history
# shows a slower creep.)
#
# They time real operations, so they run here, on a machine of their own, and not in the pull request's tests, where other test
# processes share the cores. A missed budget opens an issue (or adds the run to the one that is open) and does not fail the run: one
# slow moment on a shared machine is a reason to run it again, and a real slowdown misses its budget every time.
on:
  push:
    branches: [main]
    paths:
      - "alto/**"
      - "benchmarks/**"
      - "tests/test_performance.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/budgets.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write # to open an issue when a budget is missed

# A newer merge replaces a check still running, so two runs never report at once.
concurrency:
  group: budgets
  cancel-in-progress: true

jobs:
  budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0 libpulse-mainloop-glib0

      - name: Install Alto and its test tools
        run: python -m pip install -e ".[dev]"

      - name: Check the budgets
        id: budgets
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -m perf -o faulthandler_timeout=120 -p no:cacheprovider 2>&1 | tee budgets.txt

      - name: Open an issue if a budget was missed
        if: steps.budgets.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Performance: a budget was missed"
          {
            echo "An operation took longer than its budget in \`tests/test_performance.py\`, measured at $(git rev-parse --short HEAD)."
            echo
            echo "A shared build machine is sometimes slow for a moment, so run the Performance workflow again by hand before acting on"
            echo "this. A real slowdown misses its budget every time. If an operation was made slower on purpose, change its budget in"
            echo "\`benchmarks/budgets.py\` in the same change."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "#### What failed"
            echo
            echo '```'
            grep -E "^(FAILED|ERROR)|over its budget" budgets.txt | head -40 || true
            tail -n 3 budgets.txt
            echo '```'
            echo
            echo "#### To see it yourself"
            echo
            echo '```'
            echo "pytest -m perf                                       # the budgets"
            echo "python -m benchmarks.survey                          # every operation, slowest first"
            echo "python -m benchmarks.operations page:lesson --profile   # where the time goes in one operation"
            echo '```'
          } > issue.md
          gh label create performance --color FBCA04 --description "Alto got slower" --force
          existing=$(gh issue list --label performance --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue.md
          else
            gh issue create --title "$title" --label performance --body-file issue.md
          fi
