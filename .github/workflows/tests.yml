name: Tests

# Pull requests run the full suite on the oldest and newest supported Python, the documentation
# tests on one version, or no pytest job for housekeeping. Pushes to main run every version.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one; a push to main is never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which Python versions, and which tests, this change needs.
  scope:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.decide.outputs.kind }}
      versions: ${{ steps.decide.outputs.versions }}
      targets: ${{ steps.decide.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        env:
          ALL: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          kind=code
          versions="$ALL"
          targets=""
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            versions='["3.11", "3.15"]'
            kind=$(python3 scripts/changed_tests.py --kind --base "$BASE" --head "$HEAD")
            if [ "$kind" = docs ]; then
              versions='["3.14"]'
              targets=$(python3 scripts/changed_tests.py --base "$BASE" --head "$HEAD")
            fi
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "versions=${versions}" >> "$GITHUB_OUTPUT"
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"
          echo "Test scope: $kind"

  pytest:
    needs: scope
    if: needs.scope.outputs.kind != 'skip'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.scope.outputs.versions) }}
    env:
      # The oldest version is present on both PRs and pushes to main.
      COVERAGE_RUN: ${{ needs.scope.outputs.kind == 'code' && matrix.python-version == fromJSON(needs.scope.outputs.versions)[0] }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ env.COVERAGE_RUN == 'true' && '0' || '1' }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Qt's offscreen platform needs a few system libraries even though nothing is drawn on a screen.
      - name: Install Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0 libpulse-mainloop-glib0

      - name: Install Alto and its test tools
        run: python -m pip install -e ".[dev]"

      # The tests of the manifests printed in the plugin tutorials read their pages. They are skipped if they cannot be fetched.
      - name: Bring in the plugin tutorials
        continue-on-error: true
        run: python scripts/tutorial_docs.py all

      - name: Run the tests
        env:
          ALTO_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          TARGETS: ${{ needs.scope.outputs.targets }}
        run: |
          if [ "$COVERAGE_RUN" = true ]; then
            sh scripts/run-tests.sh --patch-coverage
          else
            sh scripts/run-tests.sh $TARGETS
          fi

      - name: Attach pytest coverage report
        if: ${{ !cancelled() && env.COVERAGE_RUN == 'true' && hashFiles('coverage.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-coverage
          path: coverage.xml
          if-no-files-found: error
          overwrite: true

  codecov:
    needs: [scope, pytest]
    if: ${{ !cancelled() && needs.scope.outputs.kind == 'code' }}
    uses: ./.github/workflows/codecov.yml
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
