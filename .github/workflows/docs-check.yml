name: Docs check

# Build the proposed merge with read-only permissions, including contributions from forks.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check plugin registrations
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_plugin_registry.py --base "$BASE"

      # The plugin tutorials live in repositories of their own; the pages that link to them need them to build.
      - name: Bring in the plugin tutorials
        run: python3 scripts/tutorial_docs.py all

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install uv==0.11.11

      - name: Build the docs
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          repository=$(cat .github/docs-preview-repository)
          site_url="https://${repository%/*}.github.io/${repository#*/}/pr-$PR"
          release=$(python scripts/docs_site.py latest $(git tag --list 'v*'))
          uv run --isolated --locked --only-group docs --python 3.13 sphinx-build -W -b dirhtml \
            -d "$RUNNER_TEMP/doctrees" -c docs/_sphinx \
            -D html_context.preview_pr="$PR" -D alto_source_revision="$GITHUB_SHA" \
            -D alto_app_version="${release#v}" docs site/dev
          printf '%s\n' "$HEAD_SHA" > site/dev/commit.txt
          python scripts/docs_site.py finish site --root-files docs/site-root --site-url "$site_url"

      - name: Check the rendered preview
        run: |
          ALTO_DOCS_HTML=site/dev python -m unittest discover -s tests -p test_rendered_docs.py
          for page in index.html getting-started/index.html release-notes/index.html \
            developer-guide/exercise-view/index.html api/alto.ui.exercise_view/class-exerciseview/index.html \
            search/index.html searchindex.js; do test -s "site/dev/$page"; done
          for page in developer-guide/exercise-view api/alto.ui.exercise_view/class-exerciseview; do
            grep -Fq "blob/$GITHUB_SHA/alto/ui/exercise_view.py#L" "site/dev/$page/index.html"
          done

      - name: Save the rendered preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-preview
          path: site/
          include-hidden-files: false
          retention-days: 3
          if-no-files-found: error
