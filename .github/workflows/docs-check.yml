name: Docs check

# Build the proposed merge with read-only permissions, including contributions from forks.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check plugin registrations
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/check_plugin_registry.py --base "$BASE"

      # The plugin tutorials live in repositories of their own; the pages that link to them need them to build.
      - name: Bring in the plugin tutorials
        run: python3 scripts/tutorial_docs.py all

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Build the docs
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/docs/Gemfile
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          PREVIEW_REPOSITORY=$(cat .github/docs-preview-repository)
          host="https://${PREVIEW_REPOSITORY%/*}.github.io"
          root="/${PREVIEW_REPOSITORY#*/}/pr-$PR"
          release=$(python3 scripts/docs_site.py latest $(git tag --list 'v*'))
          printf 'url: %s\nsite_root: %s\nbaseurl: %s/dev\ndocs_version: dev\napp_version: "%s"\n' \
            "$host" "$root" "$root" "${release#v}" > version.yml
          printf 'preview_pr: %s\n' "$PR" >> version.yml
          bundle exec jekyll build --source docs --destination site/dev --config docs/_config.yml,version.yml
          printf '%s\n' "$HEAD_SHA" > site/dev/commit.txt
          python3 scripts/docs_site.py finish site --root-files docs/site-root --site-url "$host$root"

      - name: Check that the pages are there
        run: |
          for page in index getting-started release-notes; do test -s "site/dev/${page}.html" || test -s "site/dev/${page}/index.html"; done

      - name: Save the rendered preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-preview
          path: site/
          retention-days: 3
          if-no-files-found: error
