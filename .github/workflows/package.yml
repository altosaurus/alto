name: Package

# Builds both packages on a pull request that could change them, so a break shows before a release is tagged. Nothing is published.
on:
  push:
    branches: [macos-test-build]
    paths:
      - "packaging/**"
      - "scripts/build-macos.sh"
      - ".github/workflows/package.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/build-*"
      - "pyproject.toml"
      - "alto/assets/**"
      - ".github/workflows/build-packages.yml"
      - ".github/workflows/package.yml"
  workflow_dispatch:
    inputs:
      macos_test:
        description: "Build the Apple Silicon test app only"
        type: boolean
        default: false
      macos_notarize:
        description: "Sign an Apple Silicon test DMG and submit it to Apple"
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one; a push to main is never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ inputs.macos_notarize || false }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'push' && !inputs.macos_test && !inputs.macos_notarize
    uses: ./.github/workflows/build-packages.yml

  macos:
    if: github.event_name == 'push' || inputs.macos_test || inputs.macos_notarize
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: arm64
      - name: Import Developer ID signing identity
        if: github.event_name == 'workflow_dispatch' && inputs.macos_notarize
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/alto-signing.keychain-db"
          password=$(openssl rand -hex 32)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          # Rewrap the OpenSSL-generated PKCS#12 with algorithms supported by macOS Keychain.
          printf '%s' "$P12_BASE64" | base64 -D > "$RUNNER_TEMP/original.p12"
          openssl pkcs12 -in "$RUNNER_TEMP/original.p12" -clcerts -nokeys -passin env:P12_PASSWORD -out "$RUNNER_TEMP/developer.pem"
          openssl pkcs12 -in "$RUNNER_TEMP/original.p12" -nocerts -nodes -passin env:P12_PASSWORD |
            openssl pkcs12 -export -inkey /dev/stdin -in "$RUNNER_TEMP/developer.pem" -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
              -passout env:P12_PASSWORD -out "$RUNNER_TEMP/alto-signing.p12"
          security import "$RUNNER_TEMP/alto-signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/original.p12" "$RUNNER_TEMP/alto-signing.p12"
          curl --fail --silent --show-error --retry 3 https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/devidg2.der"
          security import "$RUNNER_TEMP/devidg2.der" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          identity=$(security find-identity -v -p codesigning "$keychain" |
            awk -v team="($TEAM_ID)" '/Developer ID Application:/ && index($0, team) {print $2}')
          [[ "$identity" =~ ^[[:xdigit:]]{40}$ ]]
          echo "ALTO_MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Build and check Alto.app
        run: PYTHON=python sh scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.macos_notarize }}
        with:
          name: alto-macos-arm64-test
          path: dist/alto-*-macos-arm64-test.zip
          if-no-files-found: error
      # Preserve the exact submission if Apple's review outlasts this hosted runner.
      - uses: actions/upload-artifact@v4
        if: inputs.macos_notarize
        with:
          name: alto-macos-notary-submission
          path: dist/alto-*-macos-arm64.dmg
          retention-days: 7
          if-no-files-found: error
      - name: Notarize and verify the disk image
        if: github.event_name == 'workflow_dispatch' && inputs.macos_notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          images=(dist/alto-*-macos-arm64.dmg)
          [[ ${#images[@]} == 1 && -f "${images[0]}" ]]
          dmg=${images[0]}
          auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID")
          xcrun notarytool submit "$dmg" "${auth[@]}" --output-format json > "$RUNNER_TEMP/submission.json"
          submission=$(jq -er .id "$RUNNER_TEMP/submission.json")
          echo "Apple notarization submission: $submission" | tee -a "$GITHUB_STEP_SUMMARY"
          if ! xcrun notarytool wait "$submission" "${auth[@]}" --output-format json |
            jq -e '.status == "Accepted"'; then
            xcrun notarytool log "$submission" "${auth[@]}"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mount="$RUNNER_TEMP/alto-mounted"
          mkdir "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          codesign --verify --deep --strict "$mount/Alto.app"
          spctl --assess --type execute --verbose=2 "$mount/Alto.app"
          "$mount/Alto.app/Contents/MacOS/alto" --self-test
      - uses: actions/upload-artifact@v4
        if: inputs.macos_notarize
        with:
          name: alto-macos-arm64-notarized
          path: dist/alto-*-macos-arm64.dmg
          if-no-files-found: error
