name: Release

# Pushing a tag such as v0.1.0 builds the Linux download, Windows installer, and Apple Silicon disk image and publishes them as a GitHub release, with the
# notes of that version from CHANGELOG.md. Run by hand (workflow_dispatch) it only builds, to rehearse a release without publishing.
#
# The release is a normal one, not a pre-release: the update check inside Alto asks GitHub for the latest release, which leaves
# pre-releases out.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag is the version, and the changelog has notes for it
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "The tag ${GITHUB_REF_NAME} is not v${version}, the version in pyproject.toml." >&2
            exit 1
          fi
          python3 scripts/changelog_section.py "${version}" > /dev/null

      # Alto installs an update only if its signature verifies against the key in alto/updates.py, so a release must not be built
      # (and a long build must not be waited for) if there is no such key, or the secret is not that key's private half.
      - uses: actions/setup-python@v5
        if: github.ref_type == 'tag'
        with:
          python-version: "3.13"

      - name: The release can be signed
        if: github.ref_type == 'tag'
        env:
          ALTO_SIGNING_KEY: ${{ secrets.ALTO_SIGNING_KEY }}
        run: |
          python -m pip install --quiet pynacl certifi
          echo "a file to sign" > "${RUNNER_TEMP}/probe"
          PYTHONPATH=. python scripts/sign_release.py "${RUNNER_TEMP}/probe"

  build:
    needs: check
    uses: ./.github/workflows/build-packages.yml

  sign-windows:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows
          path: installer

      - name: Select the tested installer
        id: installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath installer -Force)
          if ($files.Count -ne 1 -or $files[0].PSIsContainer -or $files[0].Name -notmatch '^alto-[0-9]+\.[0-9]+\.[0-9]+-windows-x64-setup\.exe$') {
            throw "Expected exactly one versioned Alto Windows installer."
          }
          "path=$($files[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign and timestamp the installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ steps.installer.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true

      - name: Verify the Windows signature and timestamp
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath $env:INSTALLER_PATH
          if ($signature.Status -ne 'Valid' -or $signature.SignatureType -ne 'Authenticode' -or !$signature.TimeStamperCertificate) {
            throw "Expected a valid, timestamped Authenticode signature. $($signature.StatusMessage)"
          }
          $digest = (Get-FileHash -LiteralPath $env:INSTALLER_PATH -Algorithm SHA256).Hash
          "Publisher: $($signature.SignerCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: $digest" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-signed
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          overwrite: true

  macos:
    needs: check
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/package.yml
    with:
      macos_notarize: true
    secrets:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

  publish:
    needs: [sign-windows, macos]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '{linux,*-sources-*}'
          path: packages

      - uses: actions/download-artifact@v4
        with:
          name: windows-signed
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: alto-macos-arm64-notarized
          path: packages/macos

      - name: Assemble verified desktop downloads and matching source archives
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          (cd packages/macos && sha256sum --strict --check MACOS-SHA256SUMS)
          mv "packages/macos/alto-$version-macos-arm64.dmg" dist/
          mv "packages/linux/alto-$version-linux-x86_64.tar.gz" dist/
          mv "packages/library-sources-linux/alto-$version-linux-x86_64-library-sources.tar" dist/
          for dir in packages/qt-sources-linux packages/qt-sources-windows packages/macos/qt-sources; do
            for source in "$dir"/*-everywhere-src-*.tar.xz; do
              target="dist/${source##*/}"
              if [[ -f "$target" ]]; then
                cmp "$source" "$target"
              else
                mv "$source" "$target"
              fi
            done
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The signature is what lets a copy of Alto trust the checksums, and the checksums the files: see alto/updates.py.
      - name: Checksums, their signature and release notes
        env:
          ALTO_SIGNING_KEY: ${{ secrets.ALTO_SIGNING_KEY }}
        run: |
          python -m pip install --quiet pynacl certifi
          cd dist
          sha256sum alto-* *-everywhere-src-*.tar.xz > SHA256SUMS
          cd ..
          PYTHONPATH=. python scripts/sign_release.py dist/SHA256SUMS
          python3 scripts/changelog_section.py "${GITHUB_REF_NAME}" > notes.md
          cat >> notes.md <<'NOTES'

          ## Downloads

          - **Linux:** `alto-*-linux-x86_64.tar.gz`. Unpack it and run `sh install.sh install`. `sh install.sh uninstall` removes it and keeps your data; add `--purge` to delete that too.
          - **Windows:** `alto-*-windows-x64-setup.exe`. To inspect the publisher signature, right-click the installer and open **Properties → Digital Signatures**.
          - **macOS (Apple Silicon):** Open `alto-*-macos-arm64.dmg` and drag Alto into Applications.
          - Qt and PySide/Shiboken source archives (`*-everywhere-src-*.tar.xz`) correspond to the Qt libraries in the installers. Versions and checksums are listed in the installed `licenses/Qt/README.txt`.
          - `alto-*-linux-x86_64-library-sources.tar` has the Ubuntu source packages of the LGPL and GPL system libraries in the Linux download. They are listed in the installed `licenses/Linux/README.txt`.
          - `SHA256SUMS` has the checksum of each file, and `SHA256SUMS.sig` is its signature. A copy of Alto that updates itself checks the signature first.
          NOTES

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/alto-*.tar.gz dist/alto-*-setup.exe dist/alto-*-macos-arm64.dmg dist/*-everywhere-src-*.tar.xz dist/alto-*-library-sources.tar dist/SHA256SUMS dist/SHA256SUMS.sig \
            --title "Alto ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
