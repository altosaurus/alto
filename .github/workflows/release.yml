name: Release

# Dispatch on main to build a candidate. The annotated tag selects its immutable artifact.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check release notes
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python3 scripts/changelog_section.py "$version" > /dev/null

      - uses: actions/setup-python@v5
        with:
          python-version-file: packaging/python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.11"
          enable-cache: false
      - name: Install locked signing tools
        run: uv sync --locked --only-group signing --no-build --python python

      - name: The release can be signed
        env:
          ALTO_SIGNING_KEY: ${{ secrets.ALTO_SIGNING_KEY }}
        run: |
          echo "a file to sign" > "${RUNNER_TEMP}/probe"
          PYTHONPATH=. .venv/bin/python scripts/sign_release.py "${RUNNER_TEMP}/probe"

  build:
    needs: check
    uses: ./.github/workflows/build-packages.yml

  sign-windows:
    needs: build
    runs-on: windows-latest
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows
          path: installer

      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/download-artifact@v4
        with:
          name: qt-sources-windows
          path: qt-sources

      - name: Select the tested installer
        id: installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath installer -Force)
          if ($files.Count -ne 1 -or $files[0].PSIsContainer -or $files[0].Name -notmatch '^alto-[0-9]+\.[0-9]+\.[0-9]+-windows-x64-setup\.exe$') {
            throw "Expected exactly one versioned Alto Windows installer."
          }
          "path=$($files[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign and timestamp the installer
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ steps.installer.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true

      - name: Verify the Windows signature and timestamp
        shell: pwsh
        env:
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          $signature = Get-AuthenticodeSignature -LiteralPath $env:INSTALLER_PATH
          if ($signature.Status -ne 'Valid' -or $signature.SignatureType -ne 'Authenticode' -or !$signature.TimeStamperCertificate) {
            throw "Expected a valid, timestamped Authenticode signature. $($signature.StatusMessage)"
          }
          $target = Join-Path $env:RUNNER_TEMP "installed"
          $install = Start-Process $env:INSTALLER_PATH -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/ACCEPTTERMS=1', "/DIR=`"$target`"")
          if ($install.ExitCode -ne 0) { throw "Signed installer failed: $($install.ExitCode)" }
          $test = Start-Process "$target/alto.exe" -Wait -PassThru -ArgumentList '--self-test'
          if ($test.ExitCode -ne 0) { throw "Installed Alto failed its self-test" }
          python source/packaging/verify_qt_sources.py "$target/licenses/Qt/README.txt" qt-sources
          if ($LASTEXITCODE -ne 0) { throw "Installed Qt source checksums differ" }
          $digest = (Get-FileHash -LiteralPath $env:INSTALLER_PATH -Algorithm SHA256).Hash
          "Publisher: $($signature.SignerCertificate.Subject)" >> $env:GITHUB_STEP_SUMMARY
          "SHA-256: $digest" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-signed
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          overwrite: true

  macos:
    needs: check
    uses: ./.github/workflows/package.yml
    with:
      macos_notarize: true
    secrets:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

  candidate:
    needs: [sign-windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '{linux,*-sources-*,versions-*}'
          path: packages

      - uses: actions/download-artifact@v4
        with:
          name: windows-signed
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: alto-macos-arm64-notarized
          path: packages/macos

      - name: Assemble verified desktop downloads and matching source archives
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test -f "dist/alto-$version-windows-x64-setup.exe"
          git rev-parse HEAD > dist/SOURCE-COMMIT
          mv packages/versions-linux/linux-packages.json packages/versions-windows/windows-packages.json packages/macos/macos-packages.json dist/
          (cd packages/macos && sha256sum --strict --check MACOS-SHA256SUMS)
          mv "packages/macos/alto-$version-macos-arm64.dmg" dist/
          mv "packages/linux/alto-$version-linux-x86_64.tar.gz" dist/
          mv "packages/library-sources-linux/alto-$version-linux-x86_64-library-sources.tar" dist/
          for dir in packages/qt-sources-linux packages/qt-sources-windows packages/macos/qt-sources; do
            for source in "$dir"/qt-everywhere-src-*.tar.xz "$dir"/pyside-setup-everywhere-src-*.tar.xz; do
              target="dist/${source##*/}"
              if [[ -f "$target" ]]; then
                cmp "$source" "$target"
              else
                mv "$source" "$target"
              fi
            done
          done

      - uses: actions/setup-python@v5
        with:
          python-version-file: packaging/python-version
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.11"
          enable-cache: false
      - name: Install locked signing tools
        run: uv sync --locked --only-group signing --no-build --python python

      - name: Sign the candidate's checksums
        env:
          ALTO_SIGNING_KEY: ${{ secrets.ALTO_SIGNING_KEY }}
        run: |
          (cd dist && LC_ALL=C sha256sum * > ../SHA256SUMS)
          mv SHA256SUMS dist/
          PYTHONPATH=. .venv/bin/python scripts/sign_release.py dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: release-candidate
          path: dist/
          compression-level: 0
          if-no-files-found: error
          overwrite: true

      - name: Record the candidate for review
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "Commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag annotation: Candidate: $ARTIFACT_ID ${DIGEST#sha256:}" >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the reviewed candidate for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/download-candidate.sh

      - name: Prepare release notes
        run: |
          python3 scripts/changelog_section.py "${GITHUB_REF_NAME}" > notes.md
          cat >> notes.md <<'NOTES'

          ## Downloads

          - **Linux:** `alto-*-linux-x86_64.tar.gz`. Unpack it and run `sh install.sh install`. `sh install.sh uninstall` removes it and keeps your data; add `--purge` to delete that too.
          - **Windows:** `alto-*-windows-x64-setup.exe`. To inspect the publisher signature, right-click the installer and open **Properties → Digital Signatures**.
          - **macOS (Apple Silicon):** Open `alto-*-macos-arm64.dmg` and drag Alto into Applications.
          - Qt and PySide/Shiboken source archives (`*-everywhere-src-*.tar.xz`) correspond to the Qt libraries in the installers. Versions and checksums are listed in the installed `licenses/Qt/README.txt`.
          - `alto-*-linux-x86_64-library-sources.tar` has the Ubuntu source packages of the LGPL and GPL system libraries in the Linux download. They are listed in the installed `licenses/Linux/README.txt`.
          - `SHA256SUMS` has the checksum of each file, and `SHA256SUMS.sig` is its signature. A copy of Alto that updates itself checks the signature first.
          NOTES

      - name: Verify uploaded assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-candidate.sh
