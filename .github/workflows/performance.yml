name: Performance

# Measures how fast Alto's operations are (benchmarks/, with ASV) and keeps the results from release to release, so that a slow
# creep between versions shows even when no single budget test in the test suite fails.
#
# The daily run measures main. A manual run can measure a release tag or commit with the benchmarks
# from main, including versions that predate the benchmark suite.
# The results are kept on the branch asv-results.
#
# The history identifies possible slowdowns. An issue opens or updates only when the flagged
# operations are also more than 30% slower with both revisions measured on this runner.
on:
  schedule:
    - cron: "37 9 * * *" # 09:37 UTC daily
  workflow_dispatch:
    inputs:
      ref:
        description: "A tag or commit to measure, with the benchmarks of main (default: main)"
        required: false
        default: ""

permissions:
  contents: write # to save the results on the branch asv-results
  issues: write # to open an issue when something got slower

# Serialize scheduled and manual updates to asv-results.
concurrency:
  group: performance
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # allow for two additional runs if the whole suite needs confirmation
    env:
      QT_QPA_PLATFORM: offscreen
      MACHINE: github-ubuntu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}

      # A tag checkout is detached and has origin/main but no local main, which ASV's branches configuration needs.
      - name: Make the configured benchmark branch available
        id: benchmark-branch
        run: |
          if ! git show-ref --verify --quiet refs/heads/main; then
            git branch main origin/main
          fi

      - name: Use the benchmarks of main on this version
        if: inputs.ref != ''
        run: git checkout origin/main -- benchmarks asv.conf.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0 libpulse-mainloop-glib0

      - name: Install Alto and ASV
        run: python -m pip install -e . "asv>=0.6"

      - name: Get the results kept so far
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p .asv
          if git ls-remote --exit-code --heads "$url" asv-results > /dev/null; then
            git clone --quiet --branch asv-results "$url" .asv/results
          else
            mkdir -p .asv/results
            git -C .asv/results init --quiet --initial-branch asv-results
            git -C .asv/results remote add origin "$url"
          fi

      - name: Measure this version
        run: |
          asv machine --yes --machine "$MACHINE"
          # With an existing environment ASV saves results only when told which commit they are for.
          asv run --machine "$MACHINE" -E "existing:$(which python)" --set-commit-hash "$(git rev-parse HEAD)" --show-stderr

      - name: Compare with the previous release
        id: compare
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$(git rev-parse HEAD)^" 2> /dev/null || true)
          worse=false
          {
            echo "### Historical comparison of $(git rev-parse --short HEAD) with ${previous:-nothing}"
            echo
            if [ -z "$previous" ]; then
              echo "There is no earlier release to compare with."
            elif asv compare --machine "$MACHINE" --factor 1.3 --split "$previous" HEAD > compare.txt 2>&1; then
              echo '```'
              cat compare.txt
              echo '```'
              if grep -q '^| + ' compare.txt; then worse=true; fi
            else
              echo "The earlier release has not been measured yet. Run this workflow by hand with ref set to \`$previous\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "worse=$worse" >> "$GITHUB_OUTPUT"

      - name: Confirm flagged benchmarks on this runner
        if: steps.compare.outputs.worse == 'true'
        id: confirm
        env:
          PREVIOUS: ${{ steps.compare.outputs.previous }}
        run: |
          # A manually selected release can predate the confirmation script.
          git show "${GITHUB_WORKFLOW_SHA}:.github/scripts/confirm-performance.py" > "$RUNNER_TEMP/confirm-performance.py"
          python "$RUNNER_TEMP/confirm-performance.py" "$PREVIOUS" compare.txt worse.txt
          {
            echo "### Same-runner confirmation"
            echo
            if [ -s worse.txt ]; then
              cat worse.txt
              echo "worse=true" >> "$GITHUB_OUTPUT"
            else
              echo "None of the flagged benchmarks reproduced a slowdown above 30%."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue for confirmed slowdowns
        if: steps.confirm.outputs.worse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ steps.compare.outputs.previous }}
        run: |
          title="Performance: slower than ${PREVIOUS}"
          {
            echo "These operations were more than 30% slower at $(git rev-parse --short HEAD) than at ${PREVIOUS}."
            echo "After the historical comparison flagged them, ASV measured both revisions again on the same runner."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            cat worse.txt
            echo
            echo "#### Changes since ${PREVIOUS}"
            echo
            git log --no-merges -40 --format='- %h %s' "${PREVIOUS}..HEAD"
            echo
            echo "#### To see it yourself"
            echo
            echo '```'
            echo "python -m benchmarks.survey                          # every operation, slowest first"
            echo "python -m benchmarks.operations resize:circle        # one operation, the first time in a new process"
            echo "pytest tests/test_performance.py                     # the budgets"
            echo '```'
            echo
            echo "Where the time goes in one operation, with the table's name in place of this one:"
            echo
            echo '```'
            echo "python -m benchmarks.operations page:lesson --profile"
            echo '```'
          } > issue.md
          gh label create performance --color FBCA04 --description "Alto got slower" --force
          existing=$(gh issue list --label performance --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue.md
          else
            gh issue create --title "$title" --label performance --body-file issue.md
          fi

      - name: Keep the results
        run: |
          cd .asv/results
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=actions@github.com commit --quiet -m "Results for ${GITHUB_SHA}"
          git push --quiet origin HEAD:asv-results

      - name: Make the pages with the graphs
        run: asv publish

      - uses: actions/upload-artifact@v4
        with:
          name: speed-graphs
          path: .asv/html
