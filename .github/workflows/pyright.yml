name: Pyright

# Check the types with Pyright on every pull request and every push to main.
on:
  push:
    branches: [main]
  pull_request:
    # A change to the docs alone cannot break this, and the Tests workflow runs the tests that read the docs. (Nothing requires
    # this check to pass, so a pull request that skips it is not left waiting; if that changes, skip with a job-level `if` instead.)
    paths-ignore:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one; a push to main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Pyright reads PySide6's type hints from the installed package, so Alto and its dev tools go in first.
      - name: Install Alto and its dev tools
        run: python -m pip install -e ".[dev]"

      - name: Check the types
        run: sh scripts/typecheck.sh
