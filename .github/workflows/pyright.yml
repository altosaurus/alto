name: Pyright

# Check types for relevant pull requests and every push to main.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "**/py.typed"
      - "pyproject.toml"
      - "pyrightconfig.json"
      - "uv.lock"
      - "scripts/typecheck.sh"
      - ".github/workflows/pyright.yml"
      - "!work/**"

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one; a push to main is never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pyright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Pyright reads PySide6's type hints from the installed package, so Alto and its dev tools go in first.
      - name: Install Alto and its dev tools
        run: python -m pip install -e ".[dev]"

      - name: Check the types
        run: sh scripts/typecheck.sh
