name: Build packages

# Builds the Linux download and the Windows installer, and tests both. It is called by the Package workflow (to rehearse on a
# pull request) and by the Release workflow (to build what is published). The packages are kept as workflow artifacts.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    # Ubuntu 22.04, not the latest: the frozen program needs at least the C library of the system it was built on, so building on an
    # older Linux lets it run on more of them.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Qt's offscreen platform needs a few system libraries, which the build script uses to check that the program starts. The
      # libraries in the second line are the ones Qt's X11 plugin needs: PyInstaller copies them into the download from the system it
      # runs on, so without them the download would not start on an X11 session (and the build script fails if any is missing).
      - name: Install Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0 libpulse-mainloop-glib0
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0

      - name: Build and check the Linux download
        run: PYTHON=python sh scripts/build-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/alto-*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: qt-sources-linux
          path: dist/qt-sources/*.tar.xz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: library-sources-linux
          path: dist/alto-*-library-sources.tar
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      # Builds the installer, then installs it, runs it, uninstalls it keeping the data, and again removing the data.
      - name: Build and check the Windows installer
        shell: pwsh
        run: scripts\build-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/alto-*-setup.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: qt-sources-windows
          path: dist/qt-sources/*.tar.xz
          if-no-files-found: error
