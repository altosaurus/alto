name: Coverage

# Measure how much of Alto the tests run, and send the report to Codecov.
# Needs a repository secret named CODECOV_TOKEN: add the repository at https://app.codecov.io and copy its upload token
# into Settings > Secrets and variables > Actions.
on:
  push:
    branches: [main]
  pull_request:
    # A change to the docs alone cannot break this, and the Tests workflow runs the tests that read the docs. (Nothing requires
    # this check to pass, so a pull request that skips it is not left waiting; if that changes, skip with a job-level `if` instead.)
    paths-ignore:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one; a push to main is never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt's system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0 libpulse-mainloop-glib0

      - name: Install Alto and its test tools
        run: python -m pip install -e ".[dev]"

      - name: Run the tests with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --cov --cov-report=xml --cov-report=term

      - name: Upload the report to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # A missing token (a pull request from a fork has none) or a Codecov outage should not fail the build.
          fail_ci_if_error: false
