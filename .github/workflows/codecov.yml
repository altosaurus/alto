name: Coverage

# Measure how much of Alto the tests run, and send the report to Codecov.
# Needs a repository secret named CODECOV_TOKEN: add the repository at https://app.codecov.io and copy its upload token
# into Settings > Secrets and variables > Actions.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one; a push to main is never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select coverage scope
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          kind=code
          if [ -n "$BASE" ]; then
            kind=$(python3 scripts/changed_tests.py --kind --base "$BASE" --head "$HEAD")
          fi
          echo "kind=$kind" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.kind == 'code'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt's system libraries
        if: steps.scope.outputs.kind == 'code'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libpulse0 libpulse-mainloop-glib0

      - name: Install Alto and its test tools
        if: steps.scope.outputs.kind == 'code'
        run: python -m pip install -e ".[dev]"

      - name: Run the tests with coverage
        if: steps.scope.outputs.kind == 'code'
        env:
          ALTO_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/run-tests.sh --patch-coverage

      - name: Upload the report to Codecov
        if: ${{ steps.scope.outputs.kind == 'code' && !cancelled() && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # A missing token (a pull request from a fork has none) or a Codecov outage should not fail the build.
          fail_ci_if_error: false
