name: Docs

# Builds the docs with Sphinx, one folder for each version, and keeps them on the branch gh-pages, which GitHub Pages serves
# (Settings -> Pages -> Deploy from a branch -> gh-pages, / (root)). The site then looks like this:
#
#   /alto/dev/         the development version, rebuilt when a change to the docs is merged into main
#   /alto/v0.1.0/      one folder for each release, built once when its tag is pushed and never changed afterwards
#   /alto/             the newest stable docs, plus shared site files
#   /alto/latest/      redirects for old stable docs links
#
# A manual run can publish a missing release. Existing release archives keep their original HTML.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "A release tag to build, such as v0.0.0 (default: the development docs from the selected revision)"
        required: false
        default: ""

permissions:
  contents: write # to save the site on the branch gh-pages

# One run at a time, so that two quick merges do not both push to gh-pages.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  # A merge into main is built only if it touched the docs or what builds them; a tag and a run by hand always are. (Checked here
  # and not with a `paths` filter, which does not mix with tags.)
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          build=true
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            if git cat-file -e "${BEFORE}^{commit}" 2> /dev/null && git diff --quiet "${BEFORE}" "${GITHUB_SHA}" -- \
              docs ':(glob)alto/**/*.py' CHANGELOG.md pyproject.toml uv.lock \
              scripts/{docs_site,check_plugin_registry,tutorial_docs}.py .github/workflows/docs.yml; then
              build=false
            fi
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "Build: ${build}"

  build:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://altosaurus.github.io/alto
      SITE_PATH: /alto
    steps:
      # Select the requested release or the revision that triggered the run.
      - name: Say what to build
        id: what
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          version=dev
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then version="${GITHUB_REF_NAME}"; fi
          if [ -n "${INPUT_REF}" ]; then version="${INPUT_REF}"; fi
          if [ "${version}" != dev ] && ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "${version} is not a release tag such as v0.1.0." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref && inputs.ref != 'dev' && format('refs/tags/{0}', inputs.ref) || github.sha }}
          path: source

      # The publisher and shared files serve every version. The renderer and lockfile belong to the selected source.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
          fetch-depth: 0

      - name: Check plugin registrations before publication
        working-directory: tooling
        run: python3 scripts/check_plugin_registry.py

      - name: Get the site as it is
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages > /dev/null; then
            git clone --quiet --branch gh-pages "$url" site
          else
            mkdir site
            git -C site init --quiet --initial-branch gh-pages
            git -C site remote add origin "$url"
          fi

      - name: Check for an existing release archive
        id: archive
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          archived=false
          if [[ "$VERSION" != dev && -e "site/$VERSION" ]]; then
            test -s "site/$VERSION/index.html"
            archived=true
          fi
          echo "exists=$archived" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.archive.outputs.exists == 'false'
        with:
          python-version: "3.13"

      - name: Install uv
        if: steps.archive.outputs.exists == 'false'
        run: python -m pip install uv==0.11.11

      - name: Bring in the plugin tutorials
        if: steps.archive.outputs.exists == 'false'
        working-directory: source
        run: python scripts/tutorial_docs.py all

      - name: Build the version
        if: steps.archive.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          revision=$(git -C source rev-parse HEAD)
          stage=$(mktemp -d "$RUNNER_TEMP/alto-docs.XXXXXXXX")
          build() (
            cd source
            uv run --isolated --locked --only-group docs --python 3.13 sphinx-build -W -b dirhtml \
              -d "$stage/doctrees-$1" -c docs/_sphinx -D version="$1" -D alto_app_version="$app_version" \
              -D alto_source_revision="$revision" -D alto_site_root="$SITE_PATH" -D html_baseurl="$SITE_URL/" \
              docs "$stage/$1"
            rm "$stage/$1/.buildinfo"
          )

          if [[ "$VERSION" == dev ]]; then
            newest=$(python tooling/scripts/docs_site.py latest $(git -C source tag --list 'v*'))
            app_version="${newest#v}"
          else
            app_version="${VERSION#v}"
          fi
          build "$VERSION"
          if [[ "$VERSION" == dev ]]; then
            git -C source rev-parse --short HEAD > "$stage/dev/commit.txt"
            rm -rf site/dev
          fi
          mv "$stage/$VERSION" "site/$VERSION"

          # Promote the newest published stable tag, including when releases arrive out of order.
          stable_args=()
          newest=$(cd site && python ../tooling/scripts/docs_site.py latest v*)
          if [[ "$VERSION" == "$newest" ]]; then
            build latest
            stable_args=(--stable "$stage/latest")
          fi
          python tooling/scripts/docs_site.py finish site "${stable_args[@]}" \
            --root-files tooling/docs/site-root --site-url "$SITE_URL"

      - name: Keep the site
        run: |
          cd site
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=actions@github.com commit --quiet -m "Docs for ${{ steps.what.outputs.version }} at ${GITHUB_SHA}"
          git push --quiet origin HEAD:gh-pages
