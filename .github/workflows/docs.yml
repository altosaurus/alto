name: Docs

# Builds the docs with Jekyll, one folder for each version, and keeps them on the branch gh-pages, which GitHub Pages serves
# (Settings -> Pages -> Deploy from a branch -> gh-pages, / (root)). The site then looks like this:
#
#   /alto/dev/         the development version, rebuilt when a change to the docs is merged into main
#   /alto/v0.1.0/      one folder for each release, built once when its tag is pushed and never changed afterwards
#   /alto/             the newest stable docs, plus shared site files
#   /alto/latest/      redirects for old stable docs links
#
# By hand, `ref` builds (or rebuilds) one release, for a tag made before the docs had a dropdown: the layout, includes and styles
# of main are laid over that tag's docs, and the words stay the tag's own.
on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "A release tag to build, such as v0.0.0 (default: the development docs, from main)"
        required: false
        default: ""

permissions:
  contents: write # to save the site on the branch gh-pages

# One run at a time, so that two quick merges do not both push to gh-pages.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  # A merge into main is built only if it touched the docs or what builds them; a tag and a run by hand always are. (Checked here
  # and not with a `paths` filter, which does not mix with tags.)
  changed:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          build=true
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            if git cat-file -e "${BEFORE}^{commit}" 2> /dev/null && ! git diff --name-only "${BEFORE}" "${GITHUB_SHA}" \
              | grep -qE '^(docs/|scripts/(docs_site|check_plugin_registry|tutorial_docs)\.py$|scripts/docs_search\.rb$|\.github/workflows/docs\.yml$)'; then
              build=false
            fi
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "Build: ${build}"

  build:
    needs: changed
    if: needs.changed.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SITE_URL: https://altosaurus.github.io/alto
      SITE_PATH: /alto
    steps:
      # What is built: the tag that was pushed, the tag asked for by hand, or main.
      - name: Say what to build
        id: what
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          version=dev
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then version="${GITHUB_REF_NAME}"; fi
          if [ -n "${INPUT_REF}" ]; then version="${INPUT_REF}"; fi
          if [ "${version}" != dev ] && ! echo "${version}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "${version} is not a release tag such as v0.1.0." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ -n "${INPUT_REF}" ]; then echo "overlay=true" >> "$GITHUB_OUTPUT"; else echo "overlay=false" >> "$GITHUB_OUTPUT"; fi

      # The docs to build: those of the version (main for dev).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.what.outputs.version == 'dev' && 'main' || steps.what.outputs.version }}
          path: source

      # The tools and the layout always come from main, so that a fix reaches every build from now on.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: tooling
          fetch-depth: 0

      - name: Check plugin registrations before publication
        working-directory: tooling
        run: python3 scripts/check_plugin_registry.py

      # The plugin tutorials live in repositories of their own. Only the page and the files it shows are copied in, and every build
      # takes the tutorial as it is on its default branch, so a release's docs get a fixed copy only if they are built again.
      - name: Bring in the plugin tutorials
        run: python3 tooling/scripts/tutorial_docs.py all --docs source/docs

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: tooling/docs

      - name: Get the site as it is
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" gh-pages > /dev/null; then
            git clone --quiet --branch gh-pages "$url" site
          else
            mkdir site
            git -C site init --quiet --initial-branch gh-pages
            git -C site remote add origin "$url"
          fi

      - name: Build the version
        env:
          VERSION: ${{ steps.what.outputs.version }}
          OVERLAY: ${{ steps.what.outputs.overlay }}
          BUNDLE_GEMFILE: ${{ github.workspace }}/tooling/docs/Gemfile
        run: |
          overlay() {
            cp -R tooling/docs/_layouts/. "$1/_layouts/"
            mkdir -p "$1/_includes" "$1/assets/css" "$1/assets/js"
            cp -R tooling/docs/_includes/. "$1/_includes/"
            cp tooling/docs/assets/css/site.css "$1/assets/css/site.css"
            cp tooling/docs/assets/js/{copy-code,nav,search,toc}.js "$1/assets/js/"
            cp tooling/docs/{about.md,contents.md,using-alto.md,search.html,_config.yml} "$1/"
          }
          build() { # build DOCS DESTINATION BASEURL LABEL APP_VERSION REVISION
            rm -rf "$2"
            printf 'baseurl: %s\ndocs_version: %s\napp_version: "%s"\nsource_revision: "%s"\n' \
              "$3" "$4" "$5" "$6" > version.yml
            bundle exec jekyll build --source "$1" --destination "$2" --config "$1/_config.yml,version.yml"
            bundle exec ruby tooling/scripts/docs_search.rb "$2"
          }

          newest=$(python3 tooling/scripts/docs_site.py latest $(git -C source tag --list 'v*'))
          if [ "$VERSION" = dev ]; then APP_VERSION="${newest#v}"; else APP_VERSION="${VERSION#v}"; fi
          if [ "$OVERLAY" = true ]; then overlay source/docs; fi
          build source/docs "site/$VERSION" "$SITE_PATH/$VERSION" "$VERSION" "$APP_VERSION" "$(git -C source rev-parse HEAD)"
          if [ "$VERSION" = dev ]; then git -C source rev-parse --short HEAD > site/dev/commit.txt; fi

          # Publish the newest stable release at the root. On the first run after migration,
          # rebuild the already published stable release even if this run only builds dev.
          stable=""
          if [ "$VERSION" != dev ] && [ "$VERSION" = "$newest" ]; then
            stable="$VERSION"
            stable_docs=source/docs
          elif [ ! -f site/.stable-docs.json ] && [ -f site/latest/index.html ]; then
            stable=$(jq -r '.latest // empty' site/versions.json)
            if [ -n "$stable" ]; then
              mkdir -p stable-source
              git -C source archive "$stable" docs | tar -x -C stable-source
              stable_docs=stable-source/docs
              python3 tooling/scripts/tutorial_docs.py all --docs "$stable_docs"
            fi
          fi
          if [ -n "$stable" ]; then
            overlay "$stable_docs"
            build "$stable_docs" stable-build "$SITE_PATH" latest "${stable#v}" "$(git -C source rev-parse "$stable^{commit}")"
            python3 tooling/scripts/docs_site.py finish site --stable stable-build --root-files tooling/docs/site-root --site-url "$SITE_URL"
          else
            python3 tooling/scripts/docs_site.py finish site --root-files tooling/docs/site-root --site-url "$SITE_URL"
          fi

      - name: Keep the site
        run: |
          cd site
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions -c user.email=actions@github.com commit --quiet -m "Docs for ${{ steps.what.outputs.version }} at ${GITHUB_SHA}"
          git push --quiet origin HEAD:gh-pages
