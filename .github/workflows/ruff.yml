name: Ruff

# The installed Ruff version matches the pre-commit hook. Check relevant pull requests and every push to main.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - "**/*.ipynb"
      - "**/pyproject.toml"
      - "**/ruff.toml"
      - "**/.ruff.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/ruff.yml"
      - "!work/**"

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one; a push to main is never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install "ruff==0.17.5"

      - name: Check the formatting
        run: ruff format --check .

      - name: Check the code
        run: ruff check .
