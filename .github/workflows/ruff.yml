name: Ruff

# Checks the code with Ruff, its formatting and then its rules, on every pull request and every push to main. Until now Ruff only ran in the
# pre-commit hook, so a change made without the hook installed was not checked. The version is the one of the hook (.pre-commit-config.yaml),
# so that both hold the code to the same rules; a test keeps the two the same.
on:
  push:
    branches: [main]
  pull_request:
    # A change to the docs alone cannot break this, and the Tests workflow runs the tests that read the docs. (Nothing requires
    # this check to pass, so a pull request that skips it is not left waiting; if that changes, skip with a job-level `if` instead.)
    paths-ignore:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one; a push to main is never canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install "ruff==0.17.5"

      - name: Check the formatting
        run: ruff format --check .

      - name: Check the code
        run: ruff check .
