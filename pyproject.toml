[build-system]
requires = [
    "setuptools>=77.0.3",
]
build-backend = "setuptools.build_meta"

[project]
name = "alto"
version = "0.0.3"
maintainers = [
    { name = "Gene Dan", email = "genedan@gmail.com" },  # Project lead
]
description = "Alto: a free desktop music theory trainer with spaced repetition, for note reading, intervals, chords, scales and key signatures"
keywords = [
    "music theory",
    "ear training",
    "sight reading",
    "spaced repetition",
    "intervals",
    "chords",
    "scales",
    "key signatures",
    "solfege",
    "music education",
    "pyside6",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio",
]
readme = "README.md"
# LICENSE covers Alto’s code. Bundled assets have the terms in THIRD_PARTY_NOTICES.md.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = [
    # PySide6 6.12.0 drops a reference to None on every call that returns nothing, which aborts the program after enough
    # painting on Python 3.11 (3.12 and later never free None, so they are not affected).
    "PySide6>=6.8,!=6.12.0 ; python_version < '3.12'",
    "PySide6>=6.8 ; python_version >= '3.12'",
    "PyNaCl>=1.5",  # checks the signature of an update (Ed25519)
    "certifi>=2024.2.2",  # the certificate authorities for the update check, which a packaged build cannot count on the system for
    "fsrs>=6,<7",
    "genanki>=0.13.1,<0.14",
]

[project.urls]
Homepage = "https://altosaurus.github.io/alto/"
Documentation = "https://altosaurus.github.io/alto/getting-started/"
Source = "https://github.com/altosaurus/alto"
Issues = "https://github.com/altosaurus/alto/issues"
Changelog = "https://github.com/altosaurus/alto/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",  # runs the tests on every core at once
    "ruff>=0.8",
    "pylint>=4,<5",  # checks for duplicated code across modules before a push
    "pyright>=1.1.400",
    "pre-commit>=3.5",
    "asv>=0.6",
    "diff-cover>=9.2",
    "numpy>=1.26",  # for the tests' image and sound checks and scripts/excerpt_hit_map.py; Alto itself does not use it
    "hypothesis>=6",
]
package = [
    "pyinstaller>=6.10",  # to build the Linux and Windows downloads: see scripts/build-linux.sh
]

[project.gui-scripts]
alto = "alto.__main__:main"

[tool.setuptools.package-data]
alto = [
    "assets/excerpts/*/*",
    "assets/piano/*",
    "assets/metronome/*",
    "assets/samples/SOURCE.txt",
    "assets/samples/*/*",
    "assets/ui/*",
    "assets/fonts/*",
    "assets/licenses/*",
    "assets/icon*",
]

[tool.setuptools.packages.find]
include = [
    "alto*",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "alto",
    "benchmarks",
]
markers = [
    "perf: checks of how fast the app is, which fail when an operation is far slower than its budget",
    "motion: checks of animation or timing, which run with real durations instead of instant motion",
    "slow: thorough checks that may take longer than the time limit for one test (tests/conftest.py)",
]
addopts = "--doctest-modules"  # the Examples in docstrings run as tests, so they cannot go out of date
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.coverage.run]
source = [
    "alto",  # measure the app, not the tests
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",  # the line that starts the app is only reached by running it
]

[tool.ruff]
target-version = "py311"
line-length = 79
src = [
    "alto",
    "tests",
    "benchmarks",
]
extend-exclude = [
    "docs/api",  # Sphinx-generated AutoAPI directive sources
]

[tool.ruff.format]
skip-magic-trailing-comma = false  # a trailing comma keeps a list, dict or call one element per line (the default, kept on purpose)

[tool.ruff.lint]
preview = true  # the DOC rules are preview rules ...
explicit-preview-rules = true  # ... and this turns on only the preview rules named in `select`, not all of them
# The numpy convention switches these off, so they are added back: a docstring on every __init__, every parameter described, and
# the text of a docstring starting on the line after the opening quotes.
extend-select = [
    "D107",
    "D417",
    "D213",  # D213: a multi-line docstring starts on the line after the opening quotes
]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    # Habits the code already has, kept that way: one return style, no commented-out code, no shadowed builtins, and so on.
    "RET",
    "PERF",
    "FURB",
    "ERA",
    "A",
    "PLE",
    "ICN",
    "RSE",
    "LOG",
    "G",
    "INP",
    "PGH",
    "FLY",
    "PIE",  # no needless range(0, n), pass, or duplicated class fields
    "ISC",  # a string split over lines inside a list must be wrapped in brackets, so a missing comma cannot hide in it
    "TID252",  # absolute imports only: `from alto.ui.store import store`, never `from .store import store`
    "PLC0415",  # every import is at the top of its file, not inside a function
    "SLF001",  # no access to another object's protected members
    "PLR0917",  # only the first parameter may be positional; the rest are keyword-only, so calls name their arguments
    # Every module, class, function and method has a NumPy-style docstring that describes each parameter and the return value,
    # and every signature is annotated. Packages not yet documented are excluded below, and each line goes when its package is done.
    "D",
    "ANN",
    "DOC201",
    "DOC202",
    "DOC402",
    "DOC403",
    "DOC501",  # not DOC502: a Raises section may name errors that a called function raises
    "COM812",  # a list, dict or call split over lines ends with a trailing comma. Not COM819: a trailing comma on a short
    # line is how you keep it one per line.
]
ignore = [
    "D205",  # summaries may wrap at the prose limit
    "D200",  # a short summary can occupy its own line
    "B905",  # zip() without strict=: the zipped sequences are built to the same length
    "E741",  # one-letter names such as `l` for a letter name are normal in the music code
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = [
    "alto",  # `alto` is its own section, after the third-party packages (PySide6, numpy, pytest), in tests as well
]

[tool.ruff.lint.pylint]
max-positional-args = 1

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-line-length = 79
max-doc-length = 72  # W505 covers docstrings and standalone comments.

[tool.ruff.lint.per-file-ignores]
# Not documented yet. Remove a line when that package has its docstrings and annotations.
"alto/ui/icons.py" = [
    "E501",  # E501: SVG path data
]
"alto/ui/style.py" = [
    "E501",  # E501: the stylesheet template
]
"tests/**" = [
    "PLR0917",  # pytest passes fixtures to test functions as plain parameters
    "D200",  # a test's summary and Parameters stay on separate lines, even when there are no parameters
    "SLF001",  # tests reach into widgets to set up and check their state
]
"scripts/**" = [
    "SLF001",  # development tools reach into the window to stage it
]
"benchmarks/**" = [
    "SLF001",  # benchmarks time internal operations directly
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "PySide6.QtGui.QColor",
    "PySide6.QtCore.QModelIndex",  # defaults that are never mutated
]

[tool.pyright]
include = [
    "alto",
    "tests",
    "scripts",
    "benchmarks",
]
pythonVersion = "3.11"  # the oldest Python Alto supports, so newer-only features are caught
typeCheckingMode = "basic"

# Tests reach into widgets and settings that the application keeps optional (a screen's current question, a window's profile ...)
# and check them by asserting on what they find, so these two checks stay on for the application and are off for the tests.
[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = [
    ".",
]
reportOptionalMemberAccess = false
reportOptionalSubscript = false

[dependency-groups]
docs = [
    "myst-parser>=4",
    "python-liquid>=2,<3",
    "sphinx>=8.2",
    "sphinx-autoapi>=3.6,<4",
]
