<div id="alto-search-lab">
  <header class="as-review-header">
    <div><h1>Search styles for Alto</h1><p>Type to filter. Compare the field in tiles and navigation view.</p></div>
    <label class="as-appearance">Appearance <select id="as-appearance" aria-label="Preview appearance"><option value="light dark">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  </header>
  <div class="viz-carousel" aria-label="Alto search styles">
    <section data-variant="Soft inset" aria-label="Soft inset search"><div class="as-app as-soft" id="as-soft"></div></section>
    <section data-variant="Quiet outline" aria-label="Quiet outline search" hidden><div class="as-app as-outline" id="as-outline"></div></section>
    <section data-variant="Joined control" aria-label="Joined search and view control" hidden><div class="as-app as-joined" id="as-joined"></div></section>
    <section data-variant="Minimal underline" aria-label="Underline search" hidden><div class="as-app as-underline" id="as-underline"></div></section>
  </div>
</div>
<!--suppress CssUnusedSymbol -->
<style>
#alto-search-lab {
 --as-bg:light-dark(#efefef,#202124);--as-paper:light-dark(#ffffff,#292b2f);--as-ink:light-dark(#24272a,#eceef0);
 --as-muted:light-dark(#686d73,#afb4bb);--as-border:light-dark(#c7cace,#4d5258);--as-soft:light-dark(#e1e3e6,#34373c);
 --as-hover:light-dark(#e2e5e8,#363b42);--as-active:light-dark(#ffffff,#4b515a);--as-focus:light-dark(#287caf,#82b7e6);
 color:var(--as-ink);font:400 14px/1.5 system-ui,sans-serif;background:var(--as-bg);padding:20px;border-radius:12px;
}
#alto-search-lab * {box-sizing:border-box}
#alto-search-lab .as-review-header {display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
#alto-search-lab h1 {font:500 22px/1.35 system-ui,sans-serif;margin:0 0 5px}
#alto-search-lab .as-review-header p {margin:0;color:var(--as-muted)}
#alto-search-lab .as-appearance {display:flex;align-items:center;gap:10px}
#alto-search-lab .as-appearance select {font:inherit;color:var(--as-ink);border:1px solid var(--as-border);border-radius:6px;padding:6px 10px;background:var(--as-paper)}
#alto-search-lab .as-app {--as-sidebar:240px;min-height:620px;background:var(--as-bg);border:1px solid var(--as-border);border-radius:10px;overflow:clip}
#alto-search-lab .as-app button {font:inherit;border:1px solid transparent;color:var(--as-ink);background:transparent;border-radius:6px;cursor:default}
#alto-search-lab .as-app button:hover {background:var(--as-hover)}
#alto-search-lab .as-app button:focus-visible {outline:2px solid var(--as-focus);outline-offset:2px}
#alto-search-lab .as-top {display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;padding:12px 14px 8px}
#alto-search-lab .as-navigation {display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#alto-search-lab .as-menu {display:inline-flex;align-items:center;justify-content:center;width:30px;height:32px}
#alto-search-lab .as-sections {display:flex;gap:2px;background:var(--as-soft);padding:3px;border-radius:9px}
#alto-search-lab .as-sections button {padding:5px 10px;display:flex;align-items:center;gap:7px;min-height:30px}
#alto-search-lab .as-sections button[aria-pressed="true"] {background:var(--as-active);color:var(--as-focus);box-shadow:0 1px 2px light-dark(#00000018,#00000040)}
#alto-search-lab .as-title {font-weight:500;text-align:center}
#alto-search-lab .as-tools {display:flex;justify-content:flex-end;gap:14px}
#alto-search-lab .as-icon {display:inline-flex;align-items:center;justify-content:center}
#alto-search-lab [data-lucide] {display:inline-block;width:16px;height:16px}
#alto-search-lab .as-second {display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:0 14px 12px}
#alto-search-lab .as-searchgroup {width:var(--as-sidebar);max-width:100%;display:flex;align-items:center;gap:6px;min-height:36px}
#alto-search-lab .as-search {display:flex;align-items:center;gap:7px;flex:1;min-width:0;height:34px;padding:0 10px;border:1px solid transparent;border-radius:8px;background:var(--as-soft);color:var(--as-muted)}
#alto-search-lab .as-search:focus-within {border-color:var(--as-focus);box-shadow:0 0 0 1px var(--as-focus)}
#alto-search-lab .as-search input {font:inherit;min-width:0;width:100%;border:0;padding:0;outline:none;background:transparent;color:var(--as-ink);height:30px;border-radius:0}
#alto-search-lab .as-search input::placeholder {color:var(--as-muted);opacity:1}
#alto-search-lab .as-search input::-webkit-search-cancel-button,#alto-search-lab .as-search input::-webkit-search-decoration {appearance:none}
#alto-search-lab .as-search .as-magnifier {flex:0 0 15px}
#alto-search-lab .as-app .as-clear {padding:0;width:18px;height:23px;min-width:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--as-muted)}
#alto-search-lab .as-app .as-clear[hidden] {display:none}
#alto-search-lab .as-app .as-view {width:32px;height:34px;flex:0 0 32px;display:inline-flex;align-items:center;justify-content:center}
#alto-search-lab .as-app .as-back {padding:6px 9px;min-height:34px}
#alto-search-lab .as-outline .as-search {background:var(--as-paper);border-color:var(--as-border);border-radius:6px;padding-left:11px}
#alto-search-lab .as-outline .as-search .as-magnifier {display:none}
#alto-search-lab .as-outline .as-search:focus-within {border-color:var(--as-focus);box-shadow:0 0 0 1px var(--as-focus)}
#alto-search-lab .as-joined .as-searchgroup {gap:0;border:1px solid var(--as-border);border-radius:8px;background:var(--as-soft);min-height:34px}
#alto-search-lab .as-joined .as-search {height:32px;border:0;border-radius:7px 0 0 7px;background:transparent}
#alto-search-lab .as-joined .as-search:focus-within {box-shadow:none}
#alto-search-lab .as-joined .as-searchgroup:focus-within {border-color:var(--as-focus);box-shadow:0 0 0 1px var(--as-focus)}
#alto-search-lab .as-joined .as-view {height:32px;border:0;border-left:1px solid var(--as-border);border-radius:0 7px 7px 0;background:var(--as-active)}
#alto-search-lab .as-underline .as-search {padding:0 2px;gap:8px;background:transparent;border-radius:0;border:0;border-bottom:1px solid var(--as-border)}
#alto-search-lab .as-underline .as-search:focus-within {box-shadow:none;border-bottom:2px solid var(--as-focus)}
#alto-search-lab .as-workspace {display:grid;grid-template-columns:var(--as-sidebar) minmax(0,1fr);min-height:496px;border-top:1px solid var(--as-border)}
#alto-search-lab .as-workspace.as-tiles {grid-template-columns:minmax(0,1fr)}
#alto-search-lab .as-sidebar {padding:18px 12px;background:var(--as-paper);border-right:1px solid var(--as-border)}
#alto-search-lab .as-sidebar h3 {font:500 11px/1.5 system-ui,sans-serif;color:var(--as-muted);text-transform:uppercase;letter-spacing:.07em;margin:0 0 12px}
#alto-search-lab .as-app .as-link {display:block;text-align:left;width:100%;padding:9px 10px;margin:2px 0}
#alto-search-lab .as-app .as-link[aria-current="page"] {background:var(--as-soft)}
#alto-search-lab .as-main {min-width:0;padding:25px 24px}
#alto-search-lab .as-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:660px;margin:0 auto}
#alto-search-lab .as-app .as-tile {border-color:var(--as-border);border-radius:6px;background:var(--as-paper);padding:22px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;min-height:156px}
#alto-search-lab .as-tile .as-tileicon [data-lucide] {width:27px;height:27px}
#alto-search-lab .as-category {font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--as-muted)}
#alto-search-lab .as-name {font-weight:500}
#alto-search-lab .as-empty {padding:90px 10px;text-align:center;color:var(--as-muted)}
#alto-search-lab .as-activity h2 {font:500 18px/1.4 system-ui,sans-serif;margin:0 0 20px}
#alto-search-lab .as-paper {position:relative;background:var(--as-paper);border-radius:12px;min-height:200px;margin:20px 0;padding:30px}
#alto-search-lab .as-staff {position:absolute;left:10%;right:10%;top:64px;display:flex;flex-direction:column;gap:14px}
#alto-search-lab .as-staff span {height:1px;background:var(--as-ink)}
#alto-search-lab .as-clef {position:absolute;font:400 76px/1.3 Georgia,serif;top:33px;left:12%}
#alto-search-lab .as-note {position:absolute;left:56%;top:88px;width:22px;height:14px;border-radius:50%;background:var(--as-ink);transform:rotate(-15deg)}
#alto-search-lab .as-answers {display:flex;gap:7px;flex-wrap:wrap}
#alto-search-lab .as-answer {border:1px solid var(--as-border);background:var(--as-paper);padding:8px 14px;border-radius:6px;flex:1;text-align:center}
#alto-search-lab .as-detail {color:var(--as-muted);font-size:12px;margin-top:16px}
@media(max-width:720px){
 #alto-search-lab {padding:12px}
 #alto-search-lab .as-app {min-height:790px}
 #alto-search-lab .as-top {grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:10px}
 #alto-search-lab .as-title {grid-column:1/-1;grid-row:2;text-align:left;padding-left:3px}
 #alto-search-lab .as-tools {grid-column:2;grid-row:1;gap:8px}
 #alto-search-lab .as-sections button {padding:5px 7px;gap:4px}
 #alto-search-lab .as-navigation {gap:3px}
 #alto-search-lab .as-menu {width:22px}
 #alto-search-lab .as-second {padding:0 10px 10px;gap:8px}
 #alto-search-lab .as-workspace {grid-template-columns:minmax(0,1fr);min-height:610px;align-content:start}
 #alto-search-lab .as-sidebar {border-right:0;border-bottom:1px solid var(--as-border)}
 #alto-search-lab .as-links {display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
 #alto-search-lab .as-main {padding:20px 12px}
 #alto-search-lab .as-grid {grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 #alto-search-lab .as-app .as-tile {padding:16px 9px;min-height:165px}
}
@media(max-width:420px){
 #alto-search-lab .as-top {grid-template-columns:minmax(0,1fr)}
 #alto-search-lab .as-navigation {grid-column:1;grid-row:1}
 #alto-search-lab .as-tools {grid-column:1;grid-row:2;justify-content:flex-end}
 #alto-search-lab .as-title {grid-column:1;grid-row:3}
}
</style>
<script>
(() => {
 const root=document.getElementById('alto-search-lab');
 const appearance=document.getElementById('as-appearance');
 const exercises=[
  {name:'Note Identification',category:'Notation',about:'Identify notes on the grand staff or in seven clefs.',icon:'music'},
  {name:'Note Construction',category:'Notation',about:'Place the named note on the staff.',icon:'pencil-line'},
  {name:'Keyboard Identification',category:'Notation',about:'Name the highlighted piano key.',icon:'piano'},
  {name:'Clef Basics',category:'Notation',about:'Learn to identify and place G, F and C clefs.',icon:'list-music'},
  {name:'Circle of Fifths',category:'Scales & keys',about:'Find keys and their neighbours.',icon:'circle-dot'}
 ];
 const lessons=[
  {name:'The Circle of Fifths',category:'Scales & keys',about:'Read the circle of fifths from scratch.',icon:'circle-dot'},
  {name:'Clef Basics',category:'Notation',about:'Tell the clefs apart, from scratch.',icon:'list-music'}
 ];
 const escaped=text=>String(text).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
 const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const variants=['soft','outline','joined','underline'];
 const states=variants.map(id=>({id,element:document.getElementById('as-'+id),mode:'Exercises',pane:false,query:'',sidebarWidth:240,activity:{mode:'Exercises',name:'Note Identification'}}));
 function icons(){
  // noinspection JSUnresolvedReference
  if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});
 }
 function filtered(state){
  const query=state.query.trim().toLocaleLowerCase();
  return (state.mode==='Exercises'?exercises:lessons).filter(item=>`${item.name} ${item.category} ${item.about}`.toLocaleLowerCase().includes(query));
 }
 function results(state){
  const items=filtered(state),content=state.element.querySelector('[data-content]');
  const workspace=state.element.querySelector('.as-workspace');
  workspace.classList.toggle('as-tiles',!state.pane);
  const sidebar=state.pane?`<aside class="as-sidebar"><h3>${state.mode}</h3><div class="as-links">${items.map(item=>`<button type="button" class="as-link" data-action="open" data-name="${escaped(item.name)}" ${state.activity.name===item.name?'aria-current="page"':''}>${escaped(item.name)}</button>`).join('')||'<div class="as-detail">No matches</div>'}</div></aside>`:'';
  let main;
  if(!state.pane)main=`<div class="as-grid">${items.map(item=>`<button type="button" class="as-tile" data-action="open" data-name="${escaped(item.name)}"><span class="as-tileicon">${icon(item.icon)}</span><span class="as-category">${escaped(item.category)}</span><span class="as-name">${escaped(item.name)}</span></button>`).join('')}</div>${items.length?'':`<div class="as-empty">No ${state.mode.toLowerCase()} found.</div>`}`;
  else if(state.activity.mode==='Exercises')main=`<div class="as-activity"><h2>${escaped(state.activity.name)}</h2><div class="as-paper" role="img" aria-label="A note on a treble staff"><div class="as-staff">${'<span></span>'.repeat(5)}</div><span class="as-clef" aria-hidden="true">𝄞</span><span class="as-note" aria-hidden="true"></span></div><div class="as-answers">${['C','D','E','F','G','A','B'].map(note=>`<span class="as-answer">${note}</span>`).join('')}</div></div>`;
  else main=`<div class="as-activity"><h2>${escaped(state.activity.name)}</h2><div class="as-paper">${state.activity.name==='Clef Basics'?'A clef tells you which notes the staff’s lines and spaces represent.':'Moving clockwise adds a sharp. Moving counterclockwise adds a flat.'}</div></div>`;
  content.innerHTML=`${sidebar}<main class="as-main">${main}</main>`;
  const clear=state.element.querySelector('.as-clear');clear.hidden=!state.query;
  icons();
 }
 function render(state){
  const compact=state.pane;
  state.element.style.setProperty('--as-sidebar',state.sidebarWidth+'px');
  state.element.innerHTML=`<header class="as-top"><nav class="as-navigation" aria-label="Main navigation"><span class="as-menu" role="img" aria-label="Menu">${icon('menu')}</span><div class="as-sections">${['Exercises','Lessons'].map((mode,index)=>`<button type="button" data-action="mode" data-mode="${mode}" aria-label="${mode}" aria-pressed="${state.mode===mode}">${icon(index?'graduation-cap':'list-checks')}${compact?'':`<span>${mode}</span>`}</button>`).join('')}</div></nav><div class="as-title">${state.pane?escaped(state.activity.name):'Alto – Music Theory'}</div><div class="as-tools"><span class="as-icon" role="img" aria-label="Statistics">${icon('chart-no-axes-column')}</span><span class="as-icon" role="img" aria-label="Database">${icon('database')}</span></div></header><div class="as-second"><div class="as-searchgroup"><label class="as-search"><span class="as-magnifier">${icon('search')}</span><input type="search" aria-label="Search ${state.mode.toLowerCase()}" placeholder="Search ${state.mode.toLowerCase()}…" value="${escaped(state.query)}" autocomplete="off"><button type="button" class="as-clear" data-action="clear" aria-label="Clear search" ${state.query?'':'hidden'}>${icon('x')}</button></label><button type="button" class="as-view" data-action="pane" aria-label="${state.pane?'Return to tiles':'Show navigation pane'}" data-tooltip="${state.pane?'Return to tiles':'Show navigation pane'}">${icon(state.pane?'layout-grid':'panel-left-open')}</button></div>${state.pane?'':`<button type="button" class="as-back" data-action="back">← Back to ${state.activity.mode.toLowerCase()}</button>`}</div><div class="as-workspace" data-content></div>`;
  results(state);
 }
 states.forEach(state=>{
  render(state);
  state.element.addEventListener('input',event=>{if(event.target.matches('input[type="search"]')){state.query=event.target.value;results(state);}});
  state.element.addEventListener('click',event=>{
   const target=event.target.closest('button[data-action]');if(!target)return;
   const action=target.dataset.action;
   if(action==='clear'){state.query='';const input=state.element.querySelector('input');input.value='';results(state);input.focus();return;}
   if(action==='mode')state.mode=target.dataset.mode;
   if(action==='pane')state.pane=!state.pane;
   if(action==='back')state.pane=true;
   if(action==='open'){state.activity={mode:state.mode,name:target.dataset.name};state.pane=true;}
   render(state);
  });
  if(globalThis.Tweak){
   // noinspection JSUnresolvedReference
   const tweak=new globalThis.Tweak({container:state.element,onChange:()=>render(state)});
   // noinspection JSUnresolvedReference
   tweak.addSlider(state,'sidebarWidth',{label:'Sidebar width',min:170,max:300,step:10,unit:'px'});
  }
 });
 appearance.addEventListener('change',()=>{root.style.colorScheme=appearance.value;});
})();
</script>
