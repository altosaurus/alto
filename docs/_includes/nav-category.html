<div class="nav-head">
  {% if include.url %}<a href="{{ include.url | relative_url }}"{% if page.url == include.url %} aria-current="page"{% endif %}>{{ include.title }}</a>{% else %}<span>{{ include.title }}</span>{% endif %}
  {% if include.controls %}
  <button type="button" class="nav-toggle" data-category="{{ include.title }}" aria-controls="{{ include.controls }}"
          aria-expanded="true" aria-label="Collapse {{ include.title }}" hidden>
    <svg class="i chev" width="14" height="14" aria-hidden="true"><use href="#i-chev-r"/></svg>
  </button>
  {% endif %}
</div>
