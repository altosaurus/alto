<figure class="db-schema">
  <svg viewBox="0 0 480 248" width="480" height="248" aria-labelledby="schema-title schema-desc">
    <title id="schema-title">Alto practice database</title>
    <desc id="schema-desc">One profile can own many attempts and many items. Attempts and items are matched by profile ID, exercise, and item key.</desc>
    <g fill="none" stroke="currentColor" stroke-width="2">
      <path d="M192 67V89H105V130 M288 67V89H375V130"/>
      <path d="M200 177H280" stroke-dasharray="5 4"/>
    </g>
    <g fill="currentColor" font-size="14" text-anchor="middle">
      <text x="179" y="82">1</text><text x="301" y="82">1</text>
      <text x="82" y="120">0..*</text><text x="398" y="120">0..*</text>
    </g>
    <a href="#profiles" aria-label="Profiles data dictionary">
      <rect x="151" y="4" width="178" height="63" rx="8"/>
      <text x="240" y="29" class="db-entity">profiles</text>
      <text x="240" y="53">PK: id</text>
    </a>
    <a href="#attempts" aria-label="Attempts data dictionary">
      <rect x="10" y="130" width="190" height="112" rx="8"/>
      <text x="105" y="158" class="db-entity">attempts</text>
      <text x="105" y="188">PK: id</text>
      <text x="105" y="214">FK: profile_id</text>
    </a>
    <a href="#items" aria-label="Items data dictionary">
      <rect x="280" y="130" width="190" height="112" rx="8"/>
      <text x="375" y="158" class="db-entity">items</text>
      <text x="375" y="181">PK: profile_id,</text>
      <text x="375" y="201">exercise, item_key</text>
      <text x="375" y="226">FK: profile_id</text>
    </a>
  </svg>
  <figcaption>PK = primary key. FK = foreign key. 0..* = zero or more rows.</figcaption>
</figure>
