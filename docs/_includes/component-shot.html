{% assign regions = site.data.launch_components[include.screen] %}
{% assign image = '/assets/img/' | append: include.screen %}
<figure class="shot component-shot{% if include.labels %} component-labeled{% endif %}">
  <div class="component-map">
    <img class="for-light" src="{{ image | append: '.png' | relative_url }}" alt="{{ include.alt | escape }}" width="{{ include.width }}" height="{{ include.height }}" loading="lazy">
    <img class="for-dark" src="{{ image | append: '-dark.png' | relative_url }}" alt="{{ include.alt | escape }}" width="{{ include.width }}" height="{{ include.height }}" loading="lazy">
    {% for region in regions %}
    {% assign callout = false %}
    {% if region.group and region.type == include.highlight %}{% assign callout = true %}{% endif %}
    <a class="component-region{% if region.group %} component-group{% endif %}{% if callout %} component-callout{% endif %}{% if region.label_below %} label-below{% endif %}" href="{{ region.href | relative_url }}" aria-label="{{ region.label | escape }} ({{ region.type }})" title="{{ region.label | escape }} ({{ region.type }})"
       style="left: {{ region.rect[0] }}%; top: {{ region.rect[1] }}%; width: {{ region.rect[2] }}%; height: {{ region.rect[3] }}%"><span aria-hidden="true">{{ forloop.index }}{% if include.labels %} · {{ region.label | escape }}{% elsif callout %} · {{ region.type | escape }}{% endif %}</span></a>
    {% endfor %}
  </div>
  <figcaption>
    <ol class="component-key">
      {% for region in regions %}
      <li><a href="{{ region.href | relative_url }}">{{ region.label | escape }}</a> · <code>{{ region.type }}</code></li>
      {% endfor %}
    </ol>
  </figcaption>
</figure>
